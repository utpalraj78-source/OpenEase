version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: openease-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: openease
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openease"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    container_name: openease-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/openease
      - SESSION_SECRET=openease-production-secret-replace-with-random-uuid
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
