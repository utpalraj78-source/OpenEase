databases:
  - name: openease-db
    databaseName: openease
    user: openease_user
    plan: free

services:
  - type: web
    name: openease
    env: node
    plan: free
    buildCommand: npm install && npm run seed
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: openease-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
