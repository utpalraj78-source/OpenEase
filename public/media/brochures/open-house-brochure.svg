<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', sans-serif;">
  <rect x="0" y="0" width="800" height="200" fill="#1e3a8a" />
  <text x="50" y="80" fill="#93c5fd" font-size="18" letter-spacing="2">ANNUAL OPEN HOUSE 2026</text>
  <text x="50" y="130" fill="#ffffff" font-size="36" font-weight="bold">Explore Your Future at Campus</text>
  <text x="50" y="165" fill="#e0e7ff" font-size="16">Experience world-class labs, engage with faculty, and discover your potential.</text>

  <g transform="translate(50, 240)">
    <text x="0" y="30" fill="#0f172a" font-size="22" font-weight="bold">Why Attend Open House?</text>
    <rect x="0" y="50" width="700" height="1" fill="#e2e8f0" />

    <text x="0" y="90" fill="#1e293b" font-size="16" font-weight="bold">1. Program &amp; Curriculum Deep Dives</text>
    <text x="0" y="115" fill="#475569" font-size="14">Meet Dean, Department Heads, and faculty mentors for Computer Science, Electronics, and MBA programs.</text>

    <text x="0" y="160" fill="#1e293b" font-size="16" font-weight="bold">2. Advanced Laboratory Tours</text>
    <text x="0" y="185" fill="#475569" font-size="14">Visit the Robotics &amp; AI Center, VLSI Design Lab, and the Innovation Incubation Center.</text>

    <text x="0" y="230" fill="#1e293b" font-size="16" font-weight="bold">3. Interactive Student Panels</text>
    <text x="0" y="255" fill="#475569" font-size="14">Hear directly from current undergraduates about campus life, hostel facilities, clubs, and hackathons.</text>

    <text x="0" y="300" fill="#1e293b" font-size="16" font-weight="bold">4. Admissions &amp; Scholarship Guidance</text>
    <text x="0" y="325" fill="#475569" font-size="14">Get one-on-one counseling on admission eligibility, counseling dates, and merit scholarships.</text>
  </g>

  <g transform="translate(50, 640)">
    <rect width="700" height="150" fill="#f1f5f9" rx="8" stroke="#cbd5e1" />
    <text x="30" y="40" fill="#0f172a" font-size="18" font-weight="bold">How to Register</text>
    <text x="30" y="70" fill="#334155" font-size="14">1. Visit the OpenEase portal at http://localhost:3000</text>
    <text x="30" y="95" fill="#334155" font-size="14">2. Select an Open House session and complete your free registration</text>
    <text x="30" y="120" fill="#334155" font-size="14">3. Save your booking receipt &amp; QR pass to check in at the reception desk</text>
  </g>

  <rect x="0" y="940" width="800" height="60" fill="#0f172a" />
  <text x="50" y="975" fill="#94a3b8" font-size="14">OpenEase Event Management Engine &middot; Campus Open House Portal</text>
</svg>
